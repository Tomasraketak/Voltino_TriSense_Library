name: Compile Examples

# Compiles every example for every supported architecture on each push and pull
# request. The point is to catch the portability breaks that are invisible when
# you only ever flash one board:
#
#   - the FPU / no-FPU split in invSqrt() (TRISENSE_HAS_HW_FPU)
#   - the AVR-only branches (FIFO_20BIT_HIRES fallback, burst buffer size)
#   - RAM limits on the small cores - a sketch that no longer fits will fail to
#     link here rather than misbehave on someone's desk
#
# Run it locally with the same tool if you want:
#   arduino-cli compile --fqbn rp2040:rp2040:rpipico2 examples/AdvancedFusion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # GPS_INS_INSLIB builds against INSLIB, which lives in another repository and
  # is fetched at build time (it is AGPL-3.0, this library is MIT - see that
  # example's README). Pinned rather than tracking main, so an upstream change
  # cannot turn an unrelated pull request red. Bumping this tag IS how you
  # verify the example against a new INSLIB release.
  INSLIB_REF: v1.1.0

jobs:
  compile:
    name: ${{ matrix.board.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        board:
          # --- Primary targets: hardware FPU, full example set ---
          - name: Raspberry Pi Pico 2 (RP2350)
            fqbn: rp2040:rp2040:rpipico2
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            libraries: |
              - source-path: ./
              - name: TinyGPSPlus
            # The only board GPS_INS_INSLIB targets, so the only job that needs
            # INSLIB fetched first.
            fetch-inslib: true
            sketch-paths: examples

          # RP2040 has no FPU, so this is the one that exercises the bit-trick
          # invSqrt path on a 32-bit core.
          #
          # Sketches are listed rather than globbed here because GPS_INS_INSLIB
          # is RP2350-only by design and #errors out on a core without an FPU
          # and with only 4 KB of stack per core to give its filter.
          - name: Raspberry Pi Pico (RP2040)
            fqbn: rp2040:rp2040:rpipico
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            libraries: |
              - source-path: ./
              - name: TinyGPSPlus
            sketch-paths: |
              examples/AdvancedFusion
              examples/CustomPins
              examples/GPS_INS_Localization
              examples/GlobalAcceleration
              examples/IMUcalibration
              examples/MotionCal
              examples/RawDataI2C
              examples/SimpleFusion

          - name: ESP32
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
            libraries: |
              - source-path: ./
            # GPS_INS_Localization is RP2040/RP2350-only by design (setup1()/loop1()
            # and the Pico SDK mutex API) and #errors out elsewhere.
            sketch-paths: |
              examples/AdvancedFusion
              examples/CustomPins
              examples/GlobalAcceleration
              examples/IMUcalibration
              examples/MotionCal
              examples/RawDataI2C
              examples/SimpleFusion

          # --- Cortex-M0+, no FPU: the "other platform" path that used to get
          #     the 3 KB stack buffer on a 32 KB part. ---
          - name: Arduino MKR Zero (SAMD21)
            fqbn: arduino:samd:mkrzero
            platforms: |
              - name: arduino:samd
            libraries: |
              - source-path: ./
            sketch-paths: |
              examples/AdvancedFusion
              examples/CustomPins
              examples/GlobalAcceleration
              examples/IMUcalibration
              examples/MotionCal
              examples/RawDataI2C
              examples/SimpleFusion

          # --- 8-bit AVR: 2 KB RAM. Only the lightweight examples are expected
          #     to fit; this guards the __AVR__ branches from bit-rot. ---
          - name: Arduino Uno (AVR)
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
            sketch-paths: |
              examples/MotionCal
              examples/RawDataI2C
              examples/SimpleFusion

    steps:
      - uses: actions/checkout@v4

      # GPS_INS_INSLIB ships no INSLIB source of its own: the script clones
      # INSLIB (plus the KFCore submodule it pins) into the sketch and generates
      # the translation-unit wrappers that carry the build configuration. Doing
      # it here means CI compiles the example exactly the way a user does.
      - name: Fetch INSLIB
        if: matrix.board.fetch-inslib
        run: ./fetch_inslib.sh
        working-directory: examples/GPS_INS_INSLIB
        env:
          INSLIB_REF: ${{ env.INSLIB_REF }}

      - name: Compile
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          sketch-paths: ${{ matrix.board.sketch-paths }}
          platforms: ${{ matrix.board.platforms }}
          libraries: ${{ matrix.board.libraries }}
          enable-warnings-report: true
          enable-deltas-report: true
          verbose: false

  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checks library.properties, the folder layout and the rest of the Arduino
      # library specification.
      #
      # library-manager is deliberately off. The `update` mode asks "is this an
      # already-indexed library whose metadata still matches the index?", and
      # since Voltino TriSense has never been submitted to the Library Manager
      # index, rule LP018 fails by definition ("Library name not found in the
      # Library Manager index") - a publication status, not a defect in the code.
      # Switch this to `submit` when you actually want to publish; it then checks
      # readiness for submission instead. Expect it to want two things first:
      # a header named after the library (LS008 - a one-line Voltino_TriSense.h
      # that includes TriSense.h satisfies it without touching any sketch) and a
      # name without spaces (LP015).
      - uses: arduino/arduino-lint-action@v1
        with:
          library-manager: false
